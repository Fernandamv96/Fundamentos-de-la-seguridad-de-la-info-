[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W estilo, F errores, I imports, B bugs comunes, UP sintaxis moderna,
# S seguridad (bandit), SIM simplificaciones, RUF reglas propias de ruff
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
